name: 🚀 Kiwi CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # --- Frontend Validation (React/Vite/TypeScript/Electron) ---
  frontend-build:
    name: ⚛️ Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 18
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: knowledge-system/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: knowledge-system/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: knowledge-system/frontend
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        working-directory: knowledge-system/frontend
        run: npm run test

      - name: Validate TypeScript & Compile Frontend Build
        working-directory: knowledge-system/frontend
        run: npm run build

  # --- Backend Validation (Python/FastAPI) ---
  backend-validation:
    name: 🐍 Backend Lint & Static Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: knowledge-system/backend/requirements.txt

      - name: Install Dependencies
        working-directory: knowledge-system/backend
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # Install requirements.txt (ignoring platform-specific compiled dependencies if needed)
          pip install -r requirements.txt

      - name: Run Flake8 Code Quality Checks
        working-directory: knowledge-system/backend
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Backend Tests (pytest)
        working-directory: knowledge-system/backend
        run: |
          # run tests only if there are tests defined (avoiding failure on empty tests)
          pytest --ignore=venv/
